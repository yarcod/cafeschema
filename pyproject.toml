[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "duty-mailer"
version = "0.1.0"
description = "Skickar påminnelser om kommande sysslor enligt ett schema"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# web/ is a sibling package with its own "tests" package name, which
# collides with this root "tests" package under bare `pytest` collection
# (pytest tries to import both as the same top-level module). Restrict the
# root suite's collection to tests/ so it never walks into web/.
testpaths = ["tests"]
